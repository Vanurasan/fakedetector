[project]
name = "fakedetector"
version = "0.1.0"
description = "Инструмент обнаружения признаков искусственного создания или модификации мультимедийных файлов"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
fakedetector = "fakedetector.main:main"

[dependency-groups]
dev = [
    "httpx2>=0.28.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12.20260724",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "--cov=fakedetector",
    "--cov-branch",
    "--cov-report=term-missing",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    "*.pyc",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "C4",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    "tests/",
]

[tool.uv.sources]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fakedetector"]
